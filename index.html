<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-+v0mzbhsAutdD6J11srJDgc+4+w4o0aSgWJGYRQV3T4='; img-src https://chintai.r6.ur-net.go.jp; base-uri 'none'; form-action 'none'">
<title>家族向け</title>
<style>
  :root { --te5: #F4F4F5; --te15: #DEDEE1; --te35: #B3B3B9; --te55: #878890; --te65: #71727C;
          --te75: #5C5C68; --te85: #464754; --te95: #303140; --ts45: #05A5FC; }
  * { box-sizing: border-box; }
  html { background: #fff; -webkit-text-size-adjust: 100%; }
  body { margin: 0; color: var(--te75);
         font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
         font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  h1, p { margin: 0; }
  .page { max-width: 424px; margin: 0 auto; padding: 48px 32px 96px; }
  .checked { font-size: 12px; line-height: 20px; color: var(--te65); }
  .checked .j { font-size: 11px; }   /* 数字は 12 のまま、日本語は 11（Jさん 11/8「2px小さく」→「1px大きく」。11 は REGULATION の字の段にない値） */
  .result { margin-top: 4px; font-size: 32px; line-height: 40px; font-weight: 600; color: var(--te95); }
  .result .sub { font-size: 20px; font-weight: 700; }
  .result .sub .u { font-size: 17px; }   /* 数字以外を少し小さく（Jさん 11/8）。17 は REGULATION の字の段 */
  /* 見出しとカプセルの間 16：別のレイヤー（題と操作）なので、まとまりの中の 12・ラベルの 4 より広く、カードの間 16 と同じ段（§15・§28） */
  /* 見出しの字の下からカプセルまで ≒ 更新の字の下から見出しの字の上まで（スマホ 375px で約 16.5。Jさん 11/8「タイトルの下の空きを上と同じに」。字の墨の位置で測った） */
  .seg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .seg button { appearance: none; -webkit-appearance: none; margin: 0; height: 16px; padding: 0 8px;
                border: 1px solid var(--te15); border-radius: 8px; background: #fff; font: inherit;   /* 半径 8 のままカプセルに＝高さ 16（Jさん 11/8「半径を小さく」→「今の半径でカプセルに」） */
                font-size: 10px; line-height: 14px; color: var(--te65); white-space: nowrap; cursor: pointer;
                -webkit-tap-highlight-color: transparent; transition: color .24s, background-color .24s, border-color .24s; }
  .seg button .j { font-size: 9px; }   /* 数字と英字は 10 のまま、日本語は 9（Jさん 11/8「日本語1px小さく」。9 は REGULATION の字の段にない値） */
  .seg button[aria-pressed="true"] { border-color: var(--te85); background: var(--te85); color: #fff; cursor: default; }
  .seg button:active { transition-duration: 0s; border-color: var(--te55); }
  .seg button[aria-pressed="true"]:active { border-color: var(--te85); }
  .seg button:focus-visible { outline: 2px solid var(--te75); outline-offset: 2px; }
  .list[hidden] { display: none; }
  .rooms { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, min(100%, 360px));
           gap: 16px; align-items: start; }
  .room { position: relative; padding: 16px; border: 1px solid var(--te15); border-radius: 16px; min-width: 0;
          -webkit-tap-highlight-color: transparent; transition: border-color .24s; }
  .room:active { border-color: var(--te55); transition-duration: 0s; }
  .room:has(.name:focus-visible) { outline: 2px solid var(--te75); outline-offset: 2px; }
  .room .name::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
  /* 外観の写真（Jさん 11/8「金額の上に画像」）：カードの縁（線の内側）まで出し、幅いっぱい・4:3。
     角は外 16 − 線 1 ＝ 15 で同心（§7 の型3）。余白の内側に置く形（角 0）も同心だが、「幅いっぱい」に合うのは縁まで出す形。
     加工・切り抜き・拡大はしない（Lさん 11/8）：700×525 を丸ごと縮める（contain）。押すとカードのリンクが開く */
  /* 高さは写真の縦横比のまま（枠を 4:3 に決めると、比の違う写真の上下に隙間が出た。Jさん 11/8「上の隙間なくして」） */
  .photo { margin: -16px -16px 16px; border-radius: 15px 15px 0 0; overflow: hidden; pointer-events: none; }
  .photo img { display: block; width: 100%; height: auto; transform: scale(1.25); }   /* UR の写真に焼き込まれた白い帯を外に出す（Mac のページと同じ。Jさん 11/7「空白出ないように拡大」、11/8「上の隙間なくして」）。表示だけで写しは作らない */
  .new { font-size: 12px; line-height: 20px; font-weight: 500; color: var(--ts45); }
  .total { font-size: 24px; line-height: 32px; font-weight: 700; color: var(--te95); }
  .total .yen { margin-left: 4px; font-size: 12px; font-weight: 400; color: var(--te65); }
  .total .label { margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--te65); }
  .facts { margin-top: 8px; padding: 8px 0; border-top: 1px solid var(--te5); border-bottom: 1px solid var(--te5); }
  .name { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--te85); text-decoration: none; }
  .name:focus-visible { outline: none; }
  .station, .unit { font-size: 14px; line-height: 20px; color: var(--te65); }
  .nb { white-space: nowrap; }
  .foot span + span { margin-left: auto; text-align: right; }   /* 取得の時刻は右端へ。1行に入らず折り返しても右（Jさん 11/8） */
  .foot { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px;
          font-size: 12px; line-height: 20px; color: var(--te65); }
  /* 並びの説明（Jさん 11/8「広さ順」）。カプセルとカードの間 16 を 12＋4 に分ける：ラベルは一覧の見出しなので
     カード側に寄せる（§15 近いものは近く）。左端はカードの左端（§14・§28-1 同じレイヤーの左をそろえる）。値は 4/8 の体系（§4） */
  /* 字はカプセルの字と同じ 10px・鉄65、左はカプセルの字の頭（線 1＋内側 8＝9）にそろえる（Jさん 11/8「23区と同じ文字で左揃え」） */
  /* 下の隙間を半分に（Jさん 11/8）：行の高さを字と同じ 10 にして、字の下からカードまで 5＋4＝9 → 0＋4＝4。上は 12＋5＝17 にして前と同じ */
  .sort { margin-top: 17px; padding-left: 9px; font-size: 10px; line-height: 10px; color: var(--te65); }
  .sort + .rooms { margin-top: 4px; }
  .deny { font-size: 14px; line-height: 20px; color: var(--te65); }
  .room.none { padding: 32px 16px; text-align: center; }
  .room.none p { font-size: 12px; line-height: 20px; color: var(--te65); }
  @media (hover: hover) { .room:hover { border-color: var(--te35); } .seg button:hover { border-color: var(--te35); }
                          .room.none:hover { border-color: var(--te15); } }
  @media (max-width: 480px) { .page { padding: 24px 16px 64px; } .result { font-size: 24px; line-height: 32px; }
                              .result .sub { font-size: 20px; } }
</style>

<script>(async function () {
  var main = document.getElementById("m");
  function deny() { main.innerHTML = '<p class="deny">このページは家族向けです。</p>'; }
  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  try {
    var k = location.hash.slice(1);
    if (!/^[A-Za-z0-9_-]{43}$/.test(k)) return deny();
    var raw = bytes(k.replace(/-/g, "+").replace(/_/g, "/") + "=");
    var all = bytes(document.getElementById("d").textContent.trim());
    var S = crypto.subtle, te = new TextEncoder(), H = { name: "HMAC", hash: "SHA-256" };
    var base = await S.importKey("raw", raw, H, false, ["sign"]);
    var ek = await S.sign("HMAC", base, te.encode("enc"));
    var mk = await S.importKey("raw", await S.sign("HMAC", base, te.encode("mac")), H, false, ["verify"]);
    var body = all.subarray(0, all.length - 32), tag = all.subarray(all.length - 32);
    if (!(await S.verify("HMAC", mk, tag, body))) return deny();
    var ak = await S.importKey("raw", ek, "AES-CTR", false, ["decrypt"]);
    var pt = await S.decrypt({ name: "AES-CTR", counter: body.slice(0, 16), length: 64 }, ak, body.subarray(16));
    main.innerHTML = new TextDecoder().decode(pt);
    // 写真が読めないときは枠ごと消す（CSP で onerror の属性は動かないので、ここで見張る）
    main.querySelectorAll(".photo img").forEach(function (img) {
      function drop() { if (img.parentNode) img.parentNode.remove(); }
      img.addEventListener("error", drop);
      if (img.complete && !img.naturalWidth && img.getAttribute("loading") !== "lazy") drop();
    });
  } catch (e) { return deny(); }
  var KEY = "ur-family-list-2";   // 11/8 条件付きを最初に（Jさん）。前に覚えた選択を一度だけ捨てるため名前を変えた
  var buttons = document.querySelectorAll(".seg button");
  function show(mode) {
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === mode)); });
    document.querySelectorAll(".list").forEach(function (el) { el.hidden = el.dataset.for !== mode; });
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved === "match" || saved === "all") show(saved);
  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      show(b.dataset.mode);
      try { localStorage.setItem(KEY, b.dataset.mode); } catch (e) {}
    });
  });
})();</script>
